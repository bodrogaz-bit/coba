<!doctype html>
<html lang="id">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Petualangan Jalur Rempah Nusantara</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root{--purple:#50346f;--deep:#35224f;--paper:#fffaf1;--ink:#30283c;--green:#245943;--gold:#e3ae4e;--pink:#f5bdd5;--line:#d9c9df}
    *{box-sizing:border-box}body{margin:0;width:100%;font-family:"Work Sans",sans-serif;color:var(--ink);background:var(--purple)}
    h1,h2,h3,.brand,.tile strong{font-family:Fraunces,serif;line-height:1.2}
    button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
    :focus-visible{outline:3px solid var(--gold);outline-offset:3px}
    .shell{width:100%;min-height:100%;padding:20px clamp(14px,4vw,42px) 45px;background:radial-gradient(circle at 85% 4%,#825a9e 0,transparent 35%),linear-gradient(145deg,#513371,#392653)}
    .wrap{max-width:1120px;margin:auto}.mast{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#fff5da;border-bottom:1px solid #ffffff50;padding-bottom:15px}
    .brand{font-weight:800;letter-spacing:.04em}.page{display:none;animation:appear .3s ease both}.page.active{display:block}
    @keyframes appear{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
    .panel{background:var(--paper);border:1px solid #f8e8dc;border-radius:23px;padding:clamp(19px,4vw,36px);box-shadow:0 18px 50px #22143130}
    .eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.76rem;font-weight:700;color:#76508b}.title{color:var(--green);margin:8px 0 18px}
    .lead{line-height:1.75;color:#50465b;max-width:790px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;border:0;border-radius:12px;background:var(--green);color:#fff;padding:11px 18px;font-weight:700;text-align:center;transition:transform .2s,filter .2s}
    .btn:hover:not(:disabled),.tile:hover{filter:brightness(1.07);transform:translateY(-2px)}.btn.alt{background:#e9dcf5;color:var(--deep)}.btn.gold{background:var(--gold);color:#31221e}.btn.pink{background:var(--pink);color:var(--deep)}
    .actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}.hero{display:grid;grid-template-columns:1fr .86fr;align-items:center;gap:28px;min-height:450px;background:linear-gradient(125deg,#214b3d,#37254e);color:#fff6e5}
    .hero h1{font-size:clamp(2.1rem,5vw,4rem);margin:12px 0}.hero .lead{color:#f9e3c9}.hero .eyebrow{color:#f5d787}.hero-image{width:100%;height:370px;object-fit:cover;border-radius:19px;box-shadow:0 15px 35px #100d215e}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:13px}.tile{border:1px solid var(--line);background:#fffaf2;border-radius:17px;padding:18px;text-align:left;min-height:120px;transition:.2s;color:var(--ink)}
    .tile strong{display:block;color:var(--green);margin:8px 0;font-size:1.2rem}.tile small{color:#665b6c}.tile.blue{background:#e4f3fd}.tile.purple{background:#f0e4fa}.tile.pink{background:#ffe3ed}.summary-card{background:#ead8c4}
    .field{width:100%;display:block;background:white;border:1.5px solid #b7a7bf;border-radius:11px;padding:12px;margin:7px 0 17px;color:var(--ink)}label{font-weight:600}textarea.field{min-height:110px;resize:vertical}
    .feedback{min-height:27px;margin:14px 0;font-weight:700;line-height:1.5}.good{color:#176344}.bad{color:#a13745}
    .option,.pair-card{display:block;width:100%;border:2px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);padding:12px;text-align:left;margin:8px 0;line-height:1.5}
    .option.selected,.pair-card.selected{border-color:#70418e;background:#efe1f9}.pair-card.matched{background:#def0de;border-color:#6ba782}
    .track{height:13px;border-radius:30px;background:#ddd0e7;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#558365,#e4ad51);transition:width .3s}
  </style>
 </head>
 <body>

  <div class="shell">
    <div class="wrap">
      
      <!-- Header / Navigation -->
      <header class="mast">
        <div class="brand">Jalur Rempah</div>
      </header>

      <!-- Main Content / Hero Section -->
      <main class="panel page active">
        <div class="hero">
          <div>
            <span class="eyebrow">Nusantara</span>
            <h1>Petualangan Jalur Rempah</h1>
            <p class="lead">Jelajahi sejarah kejayaan rempah-rempah yang mengubah dunia langsung dari genggaman Anda.</p>
            <div class="actions">
              <button class="btn gold">Mulai Petualangan</button>
            </div>
          </div>
          <div>
            <!-- PERBAIKAN JALUR GAMBAR GITHUB PAGES: -->
            <img src="jalur-rempah.jpg" class="hero-image" alt="Ilustrasi Jalur Rempah">
          </div>
        </div>
      </main>

    </div>
  </div>

 </body>
</html>
